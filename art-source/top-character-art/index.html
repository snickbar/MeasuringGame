<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Top character animation artwork</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0df;color:#392719;font:16px system-ui,sans-serif}header label{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-right:8px;margin-bottom:5px}header{position:sticky;top:0;z-index:5;background:#fff9ec;padding:14px 18px;border-bottom:1px solid #cfbb91}h1{font-size:21px;margin:0 0 8px}button,select{font:inherit;padding:7px;border:1px solid #b5a17e;border-radius:7px}main{max-width:1100px;margin:auto;padding:16px}.scene{margin:12px 0 30px}h2{text-transform:capitalize} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.card{min-width:0;margin:0;border:1px solid #d5c5a5;border-radius:12px;overflow:hidden;background:#fff9ec}.art{position:relative;overflow:hidden;height:270px;display:grid;place-items:center;background-color:var(--bg,#fff);background-image:var(--pattern,linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%));background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.art img{position:absolute;inset:0;display:block;min-width:0;min-height:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in}figcaption{font-size:13px;padding:10px;overflow-wrap:anywhere}a{color:#385d8d}dialog{max-width:96vw;width:900px;max-height:95vh;padding:12px;border:2px solid #6c5136;border-radius:12px;background:#fff8e8}dialog::backdrop{background:#000b}dialog img{display:block;width:100%;height:78vh;object-fit:contain;background:var(--bg,#fff)}dialog button{float:right}p{font-size:14px;margin:5px 0}
</style>
<header><h1>Top character animation artwork</h1><label>Cutout background <select id="bg"><option value="checker">Checkerboard</option><option value="#ffffff">White</option><option value="#ff00ff">Bright magenta</option><option value="#193c54">Dark blue</option><option value="#79c96a">Green</option></select></label> <label>Scene <select id="scene"><option value="">All scenes</option></select></label><p>Separate review assets. The live game has not been changed. Tap a picture to enlarge.</p></header>
<main id="main"></main><dialog id="zoom"><button onclick="zoom.close()">Close</button><img id="large"><a id="download">Open original PNG</a></dialog>
<script src="manifest.js"></script><script>
const groups={ants:'Backyard',sunflower:'Garden',games:'Beach',house:'Kitchen',snacks:'Picnic',town:'Town',corgi:'Dog Park',wheels:'Launch Pad',lighthouse:'Seaside',underwater:'Underwater','toy-box':'Playroom',penguin:'Arctic',cactus:'Western',giraffe:'Safari',dragon:'Kingdom',space:'Space',shared:'Shared effects'};
Promise.resolve(window.HOME_ART).then(data=>{for(const [key,title] of Object.entries(groups)){const files=data.assets.filter(a=>a.scene===key);if(!files.length)continue;const section=document.createElement('section');section.className='scene';section.dataset.scene=key;const heading=document.createElement('h2');heading.textContent=title;section.append(heading);const grid=document.createElement('div');grid.className='grid';for(const item of files){const card=document.createElement('figure');card.className='card';const stage=document.createElement('div');stage.className='art';const img=document.createElement('img');img.src=item.name;img.alt=item.name;img.loading='lazy';img.onclick=()=>{large.src=item.name;download.href=item.name;download.textContent='Open '+item.name;zoom.showModal()};stage.append(img);const cap=document.createElement('figcaption');cap.textContent=item.name+' · '+item.kind+(item.adjustment?' · Adapted pose':'');card.append(stage,cap);grid.append(card)}section.append(grid);main.append(section)}}).catch(()=>main.textContent='Keep manifest.js beside this page to load the asset list.');
for(const [key,title] of Object.entries(groups)){const option=document.createElement('option');option.value=key;option.textContent=title;scene.append(option)}scene.onchange=()=>document.querySelectorAll('.scene').forEach(s=>s.hidden=!!scene.value&&s.dataset.scene!==scene.value);
bg.onchange=()=>{document.documentElement.style.setProperty('--bg',bg.value==='checker'?'#fff':bg.value);if(bg.value==='checker')document.documentElement.style.removeProperty('--pattern');else document.documentElement.style.setProperty('--pattern','none')};
</script></html>
