<pre id="polish-result" hidden></pre><script type="module">
const wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,m)=>{if(!v)throw Error(m)},until=async(fn,m)=>{for(let i=0;i<300;i++){if(fn())return;await wait(20)}throw Error(m);};
try{
 await until(()=>window.__polish&&window.__polish.profile()?.stats?.gamesPlayed===8,'App bootstrap');const api=window.__polish;
 api.objects();await wait(150);assert(document.querySelector('.recent-discoveries').textContent.includes('as you play'),'Legacy profile does not invent recent discoveries');
 await api.discoveryDemo();await until(()=>document.querySelector('#final-session-recap .session-discoveries'),'Post-game discoveries attached to existing result');
 const strip=document.querySelector('#final-session-recap .session-discoveries');assert(strip.textContent.includes('2 new objects discovered'),'Only two new encounters counted');assert(strip.querySelectorAll('.discovery-thumb').length===2,'Two discovery thumbnails');
 assert(api.profile().objectDiscoveries.acorn,'Profile listener retains discovery metadata');const first=api.profile().objectDiscoveries.acorn.t;await api.repeatDiscovery();await wait(100);assert(api.profile().objectDiscoveries.acorn.t===first,'Retries do not rediscover');assert(document.querySelectorAll('.session-discoveries').length===1,'Only one result strip');
 const view=strip.querySelector('[data-view-discoveries]');view.click();await until(()=>document.querySelector('#session-discovery-popup[open]'),'View objects opens a modal');
 let popup=document.getElementById('session-discovery-popup');assert(document.querySelector('#final-screen.active'),'Results screen stays active');assert(!document.querySelector('#items-screen.active'),'Full Objects page stays closed');assert(popup.querySelectorAll('.discovery-thumb').length===2,'Only this game’s two new objects shown');assert(popup.querySelector('[data-id=acorn]')&&popup.querySelector('[data-id=airliner]')&&!popup.querySelector('[data-id=ant]'),'Session-specific objects only');
 popup.querySelector('[data-id=acorn]').click();assert(popup.querySelector('.discovery-popup-detail h3').textContent==='acorn','Picture enlarges inside same popup');assert(!document.getElementById('item-popup'),'No separate picture overlay');popup.querySelector('[data-discovery-back]').click();assert(popup.querySelectorAll('.discovery-thumb').length===2,'Back returns to this game’s objects');
 popup.querySelector('.discovery-popup-x').click();await wait(80);assert(!document.getElementById('session-discovery-popup'),'X dismisses popup');assert(document.activeElement===view||document.activeElement.closest('#coin-reward-screen'),'Focus returns to an available results/reward control');assert(document.querySelector('#final-screen.active'),'Closing keeps results screen');
 view.click();await wait(50);popup=document.getElementById('session-discovery-popup');popup.querySelector('footer [data-discovery-close]').click();await wait(80);assert(!document.getElementById('session-discovery-popup'),'Close button dismisses popup');
 await api.addDiscoveries(3);await wait(100);assert(strip.querySelectorAll('.discovery-thumb').length===5,'All five new objects are shown directly');assert(!strip.querySelector('small'),'No hidden extras when five fit');
 await api.addDiscoveries(12);await wait(100);let grid=strip.querySelector('.discovery-grid'),columns=Number(strip.style.getPropertyValue('--discovery-cols')),shown=grid.querySelectorAll('.discovery-thumb');assert(shown.length===columns*2,'Fill two rows at current width');assert(new Set([...shown].map(n=>Math.round(n.getBoundingClientRect().top))).size===2,'Second row is visible');assert(strip.querySelector('small').textContent.includes(String(17-shown.length)),'Overflow count is accurate');
 const original=strip.style.width;strip.style.width='200px';await wait(100);assert(Number(strip.style.getPropertyValue('--discovery-cols'))===4,'Adapts to available card width');assert(strip.querySelectorAll('.discovery-thumb').length===8,'Narrower card still fills two rows');strip.style.width=original;await wait(100);
 strip.querySelector('.discovery-thumb').click();await wait(50);assert(document.querySelector('#session-discovery-popup .discovery-popup-detail'),'Result thumbnail opens the same modal directly');api.objects();await wait(100);assert(!document.getElementById('session-discovery-popup'),'Navigating away clears stale popup');
 const recent=document.querySelector('#items-screen .recent-discoveries');assert(recent.querySelectorAll('.discovery-thumb').length===6,'Recently discovered artwork');
 recent.querySelector('.discovery-thumb').click();assert(document.querySelector('#item-popup .item-popup-hint').textContent==='Seen 1 time','Large picture includes appearance count');assert(!document.querySelector('#item-popup').textContent.match(/metre|meter|centimet|length|height/i),'No measurement disclosure');document.getElementById('item-popup').click();
 const search=document.getElementById('object-search');search.value='zzzz';search.dispatchEvent(new Event('input'));assert(recent.hidden,'Recent strip hides during search');document.getElementById('object-search-clear').click();assert(!recent.hidden,'Recent strip returns after clearing search');
 for(const id of api.defaultAvatarIds())assert(api.profile().unlockedAvatars[id],'Current default is available to existing profile');
 assert(document.documentElement.scrollWidth<=innerWidth+1,'Discovery UI fits phone');
 document.getElementById('polish-result').textContent=JSON.stringify({pass:true,width:innerWidth,checks:'Actual profile transaction/listener, post-game strip placement, repeat protection, recent artwork, popup counts, search, free avatars and phone fit'});
}catch(e){document.getElementById('polish-result').textContent=JSON.stringify({pass:false,error:String(e),stack:e.stack});}
</script>
