utton></div><p id="counts"></p></nav><p id="status" role="status"></p><div id="comparisons"></div><dialog id="zoom" class="zoom-overlay"><img id="zoom-image" alt=""><button id="close">Close</button></dialog><footer><p>Built-in image generation was used for the proposed pictures. The game’s existing object images and measurement settings are unchanged.</p></footer></main><script type="module" src="artwork-comparison.mjs"></script></body></html>
