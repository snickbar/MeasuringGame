<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Size Em Up! · Scenery review</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5eb;color:#503c30;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{margin:0 0 8px}p{line-height:1.5;color:#806b56}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{background:#fffaf0;border:1px solid #dfceb3;border-radius:16px;padding:16px;min-width:0}h2{margin:0 0 6px;font-size:20px}.stage{border-radius:12px;overflow:hidden;margin:12px 0}button,a,select{color:#705132}button,select{border:1px solid #dac3a1;border-radius:10px;background:#f7e6c7;padding:10px;font:inherit;cursor:pointer}button{min-height:44px}a{margin-left:12px}.toolbar{margin:20px 0}article p{font-size:13px;margin:0;min-height:40px}@media(max-width:700px){main{padding:16px}.grid{grid-template-columns:1fr}}.error{color:#a3342c}</style><main><h1>Scenery review</h1><p>Actual game renderer · play each reveal to see the camera, scenery and subtle atmosphere movement together.</p><p id="status">Loading…</p><div class="toolbar"><select aria-label="Filter settings"><option value="all">All settings</option><option value="indoor">Indoors</option><option value="outdoor">Outdoors</option><option value="special">Underwater & fantasy</option></select></div><div class="grid"></div></main><script type="module">
import {createStackAnimation} from './stack-anim.js';
const examples=[['forest','Forest','outdoor','paperclip','deer','Dense soft greenery behind the measured objects.'],['beach','Sunset beach','outdoor','paperclip','lighthouse','Calm ocean horizon and peach sunset beyond the sand.'],['living','Living room','indoor','ant','door','Repeating warm diamond lattice; no framed artwork.'],['kitchen','Kitchen','indoor','paperclip','refrigerator','Clear cream-and-sage wall tiles; no framed artwork.'],['tabletop','Tabletop','indoor','ant','paperclip','Warm woven plaid with more visible texture.'],['farm','Farm','outdoor','ant','tractor','Low hay bales sit behind the foreground ground.'],['snow','Snow','outdoor','ant','polar-bear','Snowflakes gently fall while the camera climbs.'],['desert','Desert','outdoor','ant','cactus','Big sand dunes against a hazy pink, purple and peach sky; no clouds.'],['underwater','Underwater','special','grain-of-rice','great-white-shark','Bubbles rise slowly above seaweed near the seabed.'],['enchanted','Enchanted meadow','special','ant','pegasus','Lavender woodland, mushrooms, flowers and magic motes.'],['city','Night city','outdoor','grain-of-rice','statue-of-liberty','Layered nighttime buildings with softly lit windows.'],['grass','Original grass','outdoor','poppy-seed','ant','Original grass and clouds.'],['space','Space','special','ant','saturn-rocket','Stars and a soft nebula.']];
try{
 const html=await (await fetch('../index.html')).text(),match=html.match(/const OBJECTS = (\[[\s\S]*?\n\s*\]);/);
 const objects=(0,eval)('('+match[1]+')');let active;const controls=[];
 for(const [id,title,group,unit,target,note] of examples){
  const card=document.createElement('article');card.id=id;card.dataset.group=group;
  card.innerHTML='<h2>'+title+'</h2><p>'+note+'</p><div class="stage"></div><button disabled>Play reveal</button><a href="test.html?example='+id+'">Inspect & scrub</a>';document.querySelector('.grid').append(card);
  const control=createStackAnimation(card.querySelector('.stage'),{imageUrl:o=>'../'+o.image});
  const scene=await control.prepare(objects.find(o=>o.id===unit),objects.find(o=>o.id===target),{hMax:250,minStageH:300});scene.renderEnd();controls.push({control,scene});
  const button=card.querySelector('button');button.disabled=false;button.onclick=()=>{active?.stop();active=control;control.start(scene)};
 }
 document.querySelector('select').onchange=e=>{active?.stop();for(const card of document.querySelectorAll('article'))card.hidden=e.target.value!=='all'&&card.dataset.group!==e.target.value};
 document.getElementById('status').textContent='All 13 settings ready. Changes are in the local game too.';window.__galleryReady=true;
 window.__galleryControls=controls;
}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('status').className='error'}
</script></html>
