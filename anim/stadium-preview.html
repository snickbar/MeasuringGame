<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Size Em Up! · Stadium</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5eb;color:#503c30;font:15px system-ui,sans-serif}main{max-width:470px;margin:auto;padding:18px}h1{margin:0 0 8px;font-size:25px}p{line-height:1.5}.stage{border-radius:14px;overflow:hidden}button,a{font:inherit;color:#5e3b22}button{border:1px solid #cfb797;background:#f1dfba;border-radius:12px;padding:12px 16px;cursor:pointer;min-height:44px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}#status{font-size:13px;color:#806a57}</style></head><body><main><h1>Sports stadium</h1><p>Lined turf, tall stands and a soft crowd of color.</p><div id="stage" class="stage"></div><p id="status">Loading…</p><nav><button id="play" disabled>Play reveal</button><button id="end" disabled>Final view</button><a href="scenery-objects.html">Choose object scenery</a></nav></main><script type="module">
import {createStackAnimation} from './stack-anim.js';
import {SCENERY_BY_OBJECT} from './scenery.mjs';
const status=document.getElementById('status'),play=document.getElementById('play'),end=document.getElementById('end');
try{
 const data=await(await fetch('./scenery-object-data.json')).json();
 const unit=data.objects.find(o=>o.id==='football'),target=data.objects.find(o=>o.id==='soccer-goal');
 const control=createStackAnimation(document.getElementById('stage'),{imageUrl:o=>'../'+o.image});
 const original=SCENERY_BY_OBJECT[target.id];let scene;
 try{SCENERY_BY_OBJECT[target.id]='stadium';scene=await control.prepare(unit,target,{hMax:230,minStageH:340});}
 finally{SCENERY_BY_OBJECT[target.id]=original;}
 scene.renderEnd();play.disabled=end.disabled=false;status.textContent='Preview only. Your object choices are unchanged.';
 play.onclick=()=>control.start(scene);end.onclick=()=>{control.stop();scene.renderEnd()};
 window.__stadiumPreview={control,scene};window.__stadiumPreviewReady=true;
}catch(error){status.textContent='The stadium could not load: '+error.message}
</script></body></html>
