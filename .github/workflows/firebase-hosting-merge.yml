# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the live-update bundle (live/bundle.zip + live/version.json) so the
      # deploy below publishes it alongside the site.
      - run: node scripts/build-live-bundle.js
      - run: node scripts/verify-production-package.mjs
      # Phones update from GitHub releases, so the site does not need the update archive (hundreds of MB, different on every
      # push). Publishing it to Hosting is what filled the free storage quota and made every deploy fail with a 429.
      - run: rm -rf hosting/live
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEASURING_GAME }}
          channelId: live
          projectId: measuring-game
