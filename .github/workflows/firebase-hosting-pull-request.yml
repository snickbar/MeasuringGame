name: Deploy to Firebase Hosting on PR
# PR preview deploys are switched off (they used up Firebase Hosting storage). Run manually from the Actions tab if a preview is ever needed.
on: workflow_dispatch
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEASURING_GAME }}
          projectId: measuring-game
