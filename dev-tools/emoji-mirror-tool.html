<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emoji Mirror Tool</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #fdf8ef; color: #4a3826; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #8a7560; font-size: 14px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .card {
    background: #fff; border: 2px solid #e4d8c4; border-radius: 14px; padding: 14px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    transition: border-color .15s ease, background .15s ease;
  }
  .card:hover { border-color: #d8a35c; }
  .card.mirrored { background: #fff3dd; border-color: #e8a53d; }
  .emoji { font-size: 44px; line-height: 1; transition: transform .15s ease; }
  .card.mirrored .emoji { transform: scaleX(-1); }
  .label { font-size: 11px; color: #8a7560; text-align: center; }
  .state { font-size: 11px; font-weight: 700; color: #b5791a; min-height: 14px; }
  section { margin-bottom: 28px; }
  section h2 { font-size: 15px; margin: 0 0 12px; color: #6b5540; }
  .output-box {
    background: #2d2419; color: #f0e6d6; font-family: 'Consolas', monospace; font-size: 13px;
    padding: 16px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px;
  }
  button.copy-btn {
    background: #d8812f; color: #fff; border: none; border-radius: 8px; padding: 10px 18px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.copy-btn:active { background: #b5681f; }
  .copied-msg { font-size: 13px; color: #2f8a4a; margin-left: 10px; font-weight: 700; }
</style>
</head>
<body>
  <h1>Emoji Mirror Tool</h1>
  <p class="sub">Click any emoji to toggle a horizontal mirror preview. When you're happy with the set, copy the snippet at the bottom and hand it back.</p>

  <section>
    <h2>Default emoji</h2>
    <div class="grid" id="grid-default"></div>
  </section>

  <section>
    <h2>Emoji Pack 1</h2>
    <div class="grid" id="grid-pack1"></div>
  </section>

  <section>
    <h2>Copy this back</h2>
    <div class="output-box" id="output">// click some emoji above - this updates live</div>
    <button class="copy-btn" id="copy-btn">Copy snippet</button>
    <span class="copied-msg" id="copied-msg" style="display:none;">Copied!</span>
  </section>

<script>
  // Keep these two lists in sync with DEFAULT_EMOJIS / EMOJI_PACK_CATALOG in index.html by hand -
  // this tool is a standalone local file, not part of the live app bundle (sync-www.js doesn't
  // touch dev-tools/), so it has no way to read the real data automatically.
  const DEFAULT_EMOJIS = [
    { e: "\u{1F937}", label: "shrug" },
    { e: "\u{1F600}", label: "grin" },
    { e: "⏰", label: "alarm clock" },
    { e: "\u{1F44F}", label: "clap" },
    { e: "❤️", label: "heart" },
    { e: "\u{1F44D}", label: "thumbs up" },
    { e: "\u{1F602}", label: "laugh-cry" },
    { e: "\u{1F525}", label: "fire" },
    { e: "\u{1F389}", label: "party popper" },
  ];
  const PACK1_EMOJIS = [
    { e: "\u{1F624}", label: "steam nose" },
    { e: "\u{1F62B}", label: "tired" },
    { e: "\u{1F913}", label: "nerd" },
    { e: "\u{1F4AA}", label: "flex" },
    { e: "☠️", label: "skull" },
    { e: "\u{1F62D}", label: "sob" },
  ];

  const STORAGE_KEY = "emojiMirrorTool_state";
  let mirrored = {};
  try {
    mirrored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  } catch (e) { mirrored = {}; }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(mirrored)); } catch (e) {}
  }

  function renderGrid(containerId, list) {
    const grid = document.getElementById(containerId);
    grid.innerHTML = "";
    list.forEach(({ e, label }) => {
      const card = document.createElement("div");
      card.className = "card" + (mirrored[e] ? " mirrored" : "");
      card.innerHTML = `
        <div class="emoji">${e}</div>
        <div class="label">${label}</div>
        <div class="state">${mirrored[e] ? "MIRRORED" : ""}</div>
      `;
      card.addEventListener("click", () => {
        mirrored[e] = !mirrored[e];
        save();
        renderGrid(containerId, list);
        updateOutput();
      });
      grid.appendChild(card);
    });
  }

  function updateOutput() {
    const chosen = Object.keys(mirrored).filter((e) => mirrored[e]);
    const out = document.getElementById("output");
    if (!chosen.length) {
      out.textContent = "// nothing mirrored yet";
      return;
    }
    const list = chosen.map((e) => JSON.stringify(e)).join(", ");
    out.textContent = `const MIRRORED_EMOJIS = new Set([${list}]);`;
  }

  document.getElementById("copy-btn").addEventListener("click", () => {
    const text = document.getElementById("output").textContent;
    navigator.clipboard.writeText(text).then(() => {
      const msg = document.getElementById("copied-msg");
      msg.style.display = "inline";
      setTimeout(() => { msg.style.display = "none"; }, 1500);
    }).catch(() => {});
  });

  renderGrid("grid-default", DEFAULT_EMOJIS);
  renderGrid("grid-pack1", PACK1_EMOJIS);
  updateOutput();
</script>
</body>
</html>
